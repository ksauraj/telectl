# telectl documentation site - Stygian theme (docs engine)
# Renderer: https://github.com/ksauraj/stygian (just-the-docs style)
title: telectl
description: >-
  Telegram bot for Kubernetes cluster management with direct API access,
  per-user RBAC via impersonation, logs, exec and node operations from chat.

remote_theme: ksauraj/stygian

# ------------------------------------------------------------------ build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - README.md
  - vendor

# ------------------------------------------------------------------ content
# Every page under _docs/ becomes a sidebar entry. Permalink /:path/ keeps
# the original flat URLs (/Quick-Start/, /Installation-Guide/, ...).
collections:
  docs:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: docs

# no plugins needed: GitHub Pages injects jekyll-remote-theme automatically
# for `remote_theme`. For local development, build with an extra config file
# that sets `theme: stygian` against a path-installed gem.

# ------------------------------------------------------------------ theme
stygian:
  header:
    aux_links_new_tab: true
    aux_links:
      - { label: GitHub, href: https://github.com/ksauraj/telectl }
      - { label: Releases, href: https://github.com/ksauraj/telectl/releases }
      - { label: GHCR, href: https://github.com/ksauraj/telectl/pkgs/container/telectl }
  theme:
    default: dark
  edit:
    enabled: true
    repo: https://github.com/ksauraj/telectl
    branch: gh-pages
    view: tree
  footer:
    note: telectl docs
    right: "© 2026 ksauraj"
