# golangci-lint v2 configuration
# https://golangci-lint.run/product/migration-guide
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  go: "1.23"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  disable:
    - gochecknoglobals
    - wsl
    - testpackage
    # Disabled due to existing codebase issues (to be fixed in follow-up):
    - errcheck      # Close() errors not checked in defer statements
    - funlen        # Test functions too long
    - gochecknoinits # init() in cmd/root.go (Cobra convention)
    - goconst       # Repeated strings in tests
    - gocyclo       # High complexity in test functions
    - gosec         # G304 in test files
    - lll           # Line length > 120 in test files
    - revive        # Missing comments on exported types/functions, package comments

  settings:
    depguard:
      rules:
        no-subprocess:
          files:
            - "!**/*_test.go"
          deny:
            - pkg: "os/exec"
              desc: "telectl must not spawn processes; use client-go against the API server"
            - pkg: "io/ioutil"
              desc: "deprecated; use io and os"

    funlen:
      lines: 100
      statements: 50

    gocyclo:
      min-complexity: 15

    goconst:
      min-occurrences: 3

    lll:
      line-length: 120

    govet:
      enable:
        - shadow

    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

    errcheck:
      exclude-functions:
        - ".*Close"

formatters:
  enable:
    - gofmt
    - goimports