# golangci-lint v2 configuration
# https://golangci-lint.run/product/migration-guide
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  go: "1.23"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - stylecheck
    - unconvert
    - unparam
    - unused
    - whitespace

  disable:
    - gochecknoglobals
    - wsl
    - testpackage

  settings:
    depguard:
      rules:
        no-subprocess:
          files:
            - "!**/*_test.go"
          deny:
            - pkg: "os/exec"
              desc: "telectl must not spawn processes; use client-go against the API server"
            - pkg: "io/ioutil"
              desc: "deprecated; use io and os"

    funlen:
      lines: 100
      statements: 50

    gocyclo:
      min-complexity: 15

    goconst:
      min-occurrences: 3

    lll:
      line-length: 120

    govet:
      enable:
        - shadow

    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false