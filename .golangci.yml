run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - golint
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - stylecheck
    - tenv
    - testpackage
    - unconvert
    - unparam
    - unused
    - whitespace

  disable:
    - gochecknoglobals
    - wsl

linters-settings:
  funlen:
    lines: 100
    statements: 50

  gocyclo:
    min-complexity: 15

  lll:
    line-length: 120

  govet:
    enable:
      - shadow

  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - lll
        - gocyclo
    - path: internal/mock
      linters:
        - all