name: Feature Request
description: Suggest an idea for this project
title: "[FEAT] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting a new feature!"
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: "I'd like to see..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "I also thought about..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the project does this feature relate to?
      options:
        - Bot UI / Menu System
        - Kubernetes Operations (get, logs, exec, etc.)
        - Configuration / Config Management
        - Helm Chart
        - Impersonation / RBAC
        - Docker / CI/CD
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests
          required: true
        - label: This feature aligns with the project's goals (Kubernetes management via Telegram)
          required: true