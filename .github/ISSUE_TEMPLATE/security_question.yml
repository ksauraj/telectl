name: Security Vulnerability
description: Report a security vulnerability privately
title: "[SECURITY] "
labels: ["security", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **⚠️ Do not report security vulnerabilities publicly!**

        Please report security vulnerabilities via:
        - Email: security@ksauraj.com
        - GitHub Security Advisory: Use the "Report a vulnerability" tab in the Security section

        This form is for non-sensitive security questions only.
  - type: textarea
    id: question
    attributes:
      label: Security Question
      description: Describe your security question or concern (non-sensitive only)
      placeholder: "I have a question about the RBAC permissions..."
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I understand this is for non-sensitive questions only
          required: true
        - label: I have read the SECURITY.md policy
          required: true