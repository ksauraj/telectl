# Default values for telectl
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/ksauraj/telectl
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account for in-cluster authentication
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC configuration
rbac:
  create: true
  # If true, create ClusterRole/ClusterRoleBinding (cluster-wide access)
  # If false, create Role/RoleBinding (namespace-scoped access)
  clusterScoped: true
  # When clusterScoped: false, limit to these namespaces
  # allowedNamespaces: ["default", "production"]

# Telegram bot configuration
telegram:
  # Bot token from @BotFather - REQUIRED
  # Should be set via --set telegram.botToken="..." or in a secret
  botToken: ""
  # Comma-separated list of Telegram user IDs allowed to use the bot
  allowedUserIds: []
  # Comma-separated list of admin user IDs
  adminUserIds: []

# Kubernetes client configuration
kubernetes:
  # Path to kubeconfig file (empty = use in-cluster config)
  kubeconfigPath: ""
  # Default namespace for commands
  defaultNamespace: "default"
  # Override the active context at startup
  context: ""
  # Request timeout in seconds
  timeout: 30
  # Log mutating operations instead of performing them
  dryRun: false
  # Cluster name for display purposes (empty = use kubeconfig context name)
  clusterName: ""
  # client-go rate limiting
  burst: 10
  qps: 5.0

# Impersonation configuration
# When enabled, the bot will impersonate different K8s users/groups
# based on the Telegram user ID. This allows per-user RBAC.
impersonation:
  # Enable impersonation feature
  enabled: false
  # Default user to impersonate when no specific mapping exists
  # Can be a username or serviceaccount (e.g., "system:serviceaccount:default:readonly")
  defaultUser: ""
  # Default groups to impersonate when no specific mapping exists
  defaultGroups: []
  # Per-Telegram-user mapping to K8s user/groups
  # Key is the Telegram user ID (as string), value is user/groups
  # Example:
  # userMapping:
  #   "123456789":    # Telegram user ID
  #     user: "admin-user"
  #     groups: ["system:masters", "platform-team"]
  #   "987654321":
  #     user: "dev-user"
  #     groups: ["developers"]
  userMapping: {}

# Logging configuration
logging:
  level: "info"
  format: "json"
  output: "stdout"

# Bot configuration
bot:
  maxMessageLength: 4096
  commandPrefix: "/"
  enableMarkdown: true
  rateLimit: 30
  enableMenuButton: true
  enableReplyKeyboard: true
  menuPageSize: 10
  allowedCommands:
    - "start"
    - "help"
    - "about"
    - "version"
    - "get"
    - "describe"
    - "logs"
    - "exec"
    - "portforward"
    - "contexts"
    - "use-context"
    - "config"
    - "top"
    - "events"
    - "watch"
    - "restart"
    - "scale"
    - "resources"
    - "monitor"
    - "operations"
    - "settings"

# Pod resource limits
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

# Node selector for pod placement
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity for pod scheduling
affinity: {}

# Additional environment variables
extraEnv: []

# Additional volume mounts
extraVolumeMounts: []

# Additional volumes
extraVolumes: []