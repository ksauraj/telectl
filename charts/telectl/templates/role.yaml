{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterScoped }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "telectl.fullname" . }}
  labels:
    {{- include "telectl.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "metrics.k8s.io"]
    resources:
      - pods
      - deployments
      - services
      - replicasets
      - namespaces
      - nodes
      - configmaps
      - secrets
      - persistentvolumeclaims
      - persistentvolumes
      - ingresses
      - events
      - pods/log
      - pods/exec
      - pods/portforward
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods/exec
      - pods/portforward
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "telectl.fullname" . }}
  labels:
    {{- include "telectl.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "telectl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "telectl.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "telectl.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telectl.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "metrics.k8s.io"]
    resources:
      - pods
      - deployments
      - services
      - replicasets
      - namespaces
      - nodes
      - configmaps
      - secrets
      - persistentvolumeclaims
      - persistentvolumes
      - ingresses
      - events
      - pods/log
      - pods/exec
      - pods/portforward
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods/exec
      - pods/portforward
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "telectl.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telectl.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "telectl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "telectl.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
